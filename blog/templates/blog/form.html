{% extends "catalog/base.html" %}
{% block title %}{% if form.instance.pk %}Редактировать{% else %}Создать{% endif %} статью{% endblock %}
{% block content %}
<div class="container mt-4">
    <h1>{% if form.instance.pk %}Редактировать{% else %}Создать новую{% endif %} статью</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'blog:list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
