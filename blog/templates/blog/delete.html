{% extends "catalog/base.html" %}
{% block title %}Удалить статью{% endblock %}
{% block content %}
<div class="container mt-4">
    <h1>Удалить статью "{{ object.title }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'blog:detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
