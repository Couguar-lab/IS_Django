<!doctype html>
<html lang="ru" class="h-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Skystore{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Стили для sticky footer -->
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        .wrapper {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1 0 auto;  /* Главный контент растягивается, чтобы футер был внизу */
        }
        footer {
            flex-shrink: 0;  /* Футер не сжимается */
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column h-100">
    <div class="wrapper">
        <!-- Подключаем подшаблон с главным меню -->
        {% include "catalog/includes/menu.html" %}

        <!-- Сообщения Django -->
        {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Основное содержимое страницы -->
        <main class="flex-fill">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <!-- Футер -->
    <footer class="mt-auto py-4 bg-dark text-white text-center">
        <div class="container">
            <small>SkyStore &copy; 2023–2025. Все права защищены.</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
